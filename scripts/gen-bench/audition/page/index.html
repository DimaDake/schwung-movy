<title>Movy Generator Audition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one thumb-driven column, a Move-like screen (roll) on a graphite
   body, the rating pads fixed at the bottom where the thumb rests. */
:root {
  --bg: #eef0f2; --panel: #ffffff; --ink: #1b1f24; --ink-soft: #4d5661; --ink-faint: #8b95a0; --rule: #d6dbe0;
  --accent: #2f6fde; --lane-hi: rgba(47, 111, 222, .10); --mark: #e0861f;
  --keep: #23935a; --meh: #b58a12; --bad: #d1433b;
  --drums: #6b7480; --bass: #2f6fde; --chords: #8a5bd6; --lead: #d6612f;
  --font-display: "Archivo Narrow", "Arial Narrow", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181c; --panel: #1f242a; --ink: #e9edf1; --ink-soft: #b3bcc6; --ink-faint: #6f7a86; --rule: #2f363e;
  --accent: #6d9cf0; --lane-hi: rgba(109, 156, 240, .14); --mark: #f0a24a;
  --keep: #45c07f; --meh: #d8b13a; --bad: #ef6a61;
  --drums: #9aa4b0; --bass: #6d9cf0; --chords: #b08cf0; --lead: #f08a5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1f242a; --ink: #e9edf1; --ink-soft: #b3bcc6; --ink-faint: #6f7a86; --rule: #2f363e;
  --accent: #6d9cf0; --lane-hi: rgba(109, 156, 240, .14); --mark: #f0a24a;
  --keep: #45c07f; --meh: #d8b13a; --bad: #ef6a61;
  --drums: #9aa4b0; --bass: #6d9cf0; --chords: #b08cf0; --lead: #f08a5a; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-block: 12px 150px; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h1 { font: 700 20px/1.1 var(--font-display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.data { font: 500 12px/1.3 var(--font-data); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { font: 700 11px/1 var(--font-data); text-transform: uppercase; letter-spacing: .08em; padding: 5px 7px; border-radius: 4px; background: var(--ink); color: var(--bg); }
.badge.pair { background: var(--mark); color: #1b1f24; }
.ask { font: 700 26px/1.1 var(--font-display); margin: 0; }
.ask b { color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.opt { min-width: 44px; font-family: var(--font-data); position: relative; }
.opt[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt[data-r="keep"] { background: var(--keep); color: #fff; border-color: transparent; }
.opt[data-r="meh"] { background: var(--meh); color: #1b1f24; border-color: transparent; }
.opt[data-r="bad"] { background: var(--bad); color: #fff; border-color: transparent; }
.chip { font: 700 12px/1 var(--font-data); text-transform: uppercase; letter-spacing: .06em; padding: 9px 10px; }
.chip[aria-pressed="true"] { opacity: .45; text-decoration: line-through; }
.chip.target { border: 2px solid var(--accent); }
.screen { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
canvas { display: block; width: 100%; height: min(44vh, 320px); touch-action: manipulation; }
.hint { font-size: 12px; color: var(--ink-faint); margin: 0; }
.transport { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: center; }
.transport input { width: 100%; min-width: 0; accent-color: var(--accent); }
#play { min-width: 74px; font-weight: 700; }
#solo { user-select: none; -webkit-user-select: none; }
#solo.on { background: var(--accent); color: #fff; }
.reveal { background: var(--panel); border-left: 4px solid var(--accent); padding: 10px 12px; border-radius: 6px; display: grid; gap: 4px; }
.reveal .disagree { color: var(--mark); font-weight: 700; }
.pads { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--rule);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.pads > div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.pad { font: 700 18px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 18px 0; color: #fff; border: 0; border-radius: 10px; }
.pad.keep { background: var(--keep); } .pad.meh { background: var(--meh); color: #1b1f24; } .pad.bad { background: var(--bad); }
.pad[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--ink); }
#next { grid-column: 1 / -1; font: 700 16px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 14px; background: var(--ink); color: var(--bg); border: 0; }
.sheet { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.reason[aria-pressed="true"] { background: var(--bad); color: #fff; border-color: transparent; }
textarea { width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 8px; min-height: 44px; }
.start { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 5; padding: 24px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.start > div { display: grid; gap: 14px; max-width: 360px; }
.start h1 { font-size: 34px; }
.start button { background: var(--accent); color: #fff; border: 0; font: 700 18px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 18px; }
#status[data-s="offline"], #status[data-s="refused"] { color: var(--bad); font-weight: 700; }
.mixer { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
.mixer summary { font: 700 13px/1 var(--font-data); text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
#faders { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: center; margin-top: 12px; }
#faders label { font: 700 12px/1 var(--font-data); text-transform: uppercase; letter-spacing: .06em; }
#faders input { width: 100%; min-width: 0; accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="start" id="start"><div>
  <h1>Generator Audition</h1>
  <p>Listen to each part over its scene. Rate it, and tap the roll where it goes wrong.</p>
  <p class="data" id="loadInfo">Loading cases…</p>
  <button id="go" disabled>Start listening</button>
</div></div>

<main>
  <div class="top"><h1>Generator Audition</h1><span class="data" id="progress"></span></div>
  <div class="meta"><span class="badge" id="kind"></span><span class="badge pair" id="pair" hidden></span><span class="data" id="info"></span></div>
  <p class="ask" id="ask"></p>
  <div class="row" id="options" hidden></div>
  <div class="row" id="chips"></div>
  <div class="screen"><canvas id="roll" aria-label="Note roll. Tap a beat to mark where it goes wrong."></canvas></div>
  <p class="hint">Tap the roll to mark a beat. Tap a mark again to clear it.</p>
  <div class="transport">
    <button id="play">Play</button>
    <button id="solo">Hold solo</button>
    <input id="tempo" type="range" min="60" max="180" step="1" aria-label="Tempo">
    <span class="data" id="bpm"></span>
  </div>
  <details class="mixer" id="mixer"><summary>Mixer</summary><div id="faders"></div></details>
  <div class="sheet" id="reasons" hidden>
    <strong>What is wrong?</strong>
    <div class="row" id="reasonChips"></div>
    <textarea id="note" placeholder="Optional note"></textarea>
    <div class="row"><button id="saveBad">Save as bad</button><button id="cancelBad">Cancel</button></div>
  </div>
  <div class="reveal" id="reveal" hidden></div>
  <div class="row"><button id="best" hidden aria-pressed="false">☆ Best of the six</button><button id="midi" hidden>MIDI for the Move</button><button id="skip">Skip case</button></div>
  <p class="data" id="status"></p>
</main>

<div class="pads"><div>
  <button class="pad keep" id="keep">Keep</button>
  <button class="pad meh" id="meh">Meh</button>
  <button class="pad bad" id="bad">Bad</button>
  <button id="next" hidden>Next</button>
</div></div>
<!--APP-->
